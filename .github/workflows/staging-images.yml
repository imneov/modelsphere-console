name: staging images

on:
  push:
    branches: ["staging/**"]

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-configuration:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    outputs:
      mirror: ${{ steps.registry.outputs.mirror }}
    steps:
      - name: Validate optional registry configuration
        id: registry
        env:
          REGISTRY: ${{ vars.STAGING_REGISTRY }}
          REPOSITORY: ${{ vars.STAGING_IMAGE_REPOSITORY }}
        run: |
          set -eu
          if [ -z "$REGISTRY" ] && [ -z "$REPOSITORY" ]; then
            echo 'mirror=false' >> "$GITHUB_OUTPUT"
          elif [ -z "$REGISTRY" ] || [ -z "$REPOSITORY" ]; then
            echo 'Both staging registry variables must be configured.' >&2
            exit 1
          else
            case "$REPOSITORY" in
              "$REGISTRY"/*) echo 'mirror=true' >> "$GITHUB_OUTPUT" ;;
              *) echo 'Staging repository must belong to the configured registry.' >&2; exit 1 ;;
            esac
          fi

  image:
    needs: registry-configuration
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: console-staging
            dockerfile: Dockerfile
          - image: billing-staging
            dockerfile: Dockerfile
            target: billing
          - image: console-upstream-fixture
            dockerfile: tools/billing/Dockerfile.upstream
          - image: console-vllm-bench
            dockerfile: tools/billing/Dockerfile.bench
          - image: console-queue-bench
            dockerfile: tools/billing/Dockerfile.queuebench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: needs.registry-configuration.outputs.mirror == 'true'
        with:
          registry: ${{ vars.STAGING_REGISTRY }}
          username: ${{ secrets.STAGING_REGISTRY_USERNAME }}
          password: ${{ secrets.STAGING_REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ${{ needs.registry-configuration.outputs.mirror == 'true' && format('{0}:{1}-{2}', vars.STAGING_IMAGE_REPOSITORY, matrix.image, github.sha) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  runtime-mirror:
    needs: registry-configuration
    if: github.event.repository.fork && needs.registry-configuration.outputs.mirror == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vcluster
            source: ghcr.io/loft-sh/vcluster-oss:0.37.6
          - name: kubernetes
            source: ghcr.io/loft-sh/kubernetes:v1.36.6
          - name: coredns
            source: coredns/coredns:1.14.2
          - name: postgres
            source: postgres:16-alpine
          - name: redis
            source: redis:7.4-alpine
          - name: alpine
            source: alpine:3.20
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ vars.STAGING_REGISTRY }}
          username: ${{ secrets.STAGING_REGISTRY_USERNAME }}
          password: ${{ secrets.STAGING_REGISTRY_PASSWORD }}
      - name: Install registry client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
      - name: Mirror the original AMD64 manifest
        env:
          SOURCE: ${{ matrix.source }}
          TARGET: ${{ vars.STAGING_IMAGE_REPOSITORY }}:runtime-${{ matrix.name }}-${{ github.sha }}
        run: |
          skopeo --override-os linux --override-arch amd64 copy --preserve-digests \
            --authfile "$HOME/.docker/config.json" "docker://$SOURCE" "docker://$TARGET"
          skopeo inspect --authfile "$HOME/.docker/config.json" --format '{{.Digest}}' "docker://$TARGET" >> "$GITHUB_STEP_SUMMARY"

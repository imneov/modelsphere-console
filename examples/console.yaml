# consoled configuration. One document; see internal/config for the schema.

cluster:
  # Empty means in-cluster. On a laptop, point at a kubeconfig:
  # kubeconfig: ~/.kube/config
  # context: kind-modelsphere

server:
  addr: ":8080"
  auth:
    # HS256 signing key. In a cluster this comes from a Secret via env; never
    # commit a real one. Shared with Rise Global on upgrade.
    jwtSecret: "dev-only-change-me"
    issuer: "https://console.modelsphere.local"
    tokenTTL: 24h

# Everything not owned by consoled is federated to a backend. Requests under
# prefix are reverse-proxied to url, the prefix replaced by url's path:
# /api/deploy/catalog -> http://swissd.swiss.svc:8080/api/catalog. The backend
# receives X-Remote-User / X-Remote-Group and the caller's Bearer token.
# Access is RBAC on resource "backends", resourceName = name.
backends:
  - name: swiss
    prefix: /api/deploy
    url: http://swissd.swiss.svc:8080/api

# console configuration. One document; see internal/config for the schema.

cluster:
  # Empty means in-cluster. On a laptop, point at a kubeconfig:
  # kubeconfig: ~/.kube/config
  # context: kind-modelsphere

server:
  addr: ":8080"
  auth:
    # HS256 signing key. In a cluster this comes from a Secret via env; never
    # commit a real one. Shared with Rise Global on upgrade.
    jwtSecret: "dev-only-change-me"
    issuer: "https://console.modelsphere.local"
    tokenTTL: 24h

# Everything not owned by console is federated to a backend. Requests under
# prefix are reverse-proxied to url, the prefix replaced by url's path:
# /api/deploy/catalog -> http://swissd.swiss.svc:8080/api/catalog. The backend
# receives X-Remote-User / X-Remote-Group and the caller's Bearer token.
# Access is RBAC on resource "backends", resourceName = name.
backends:
  - name: swiss
    prefix: /api/deploy
    url: http://swissd.swiss.svc:8080/api

  # The inference gateway the Playground talks to. Nothing here names a URL: the
  # profile is swiss's site profile ConfigMap, the document swissd deploys from,
  # and console reads the entrypoint Service, the route and the key Secret out of
  # it -- then keeps reading, so a model deployed later shows up without a restart.
  # Without swissd, name the route ConfigMap and its Service directly:
  #
  #   gateway:
  #     configMap: llm/openresty-conf
  #     service: llm/openresty
  #     route: llm-gateway        # optional; the aggregate route is chosen
  #     secretRef: llm/openresty-keys
  - name: llm
    prefix: /api/llm
    gateway:
      profile: llm/site-profile

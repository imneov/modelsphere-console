# console configuration. One document; see internal/config for the schema.

cluster:
  # Zero preserves client-go rate limits; configure both for larger controller workloads.
  clientQPS: 0
  clientBurst: 0
  # Empty means in-cluster. On a laptop, point at a kubeconfig:
  # kubeconfig: ~/.kube/config
  # context: kind-modelsphere

server:
  addr: ":8080"
  # Prometheus metrics, on a port of their own. "off" disables them.
  metricsAddr: ":9090"
  auth:
    # HS256 signing key. In a cluster this comes from a Secret via env; never
    # commit a real one. Shared with Rise Global on upgrade.
    jwtSecret: "dev-only-change-me"
    issuer: "https://console.modelsphere.local"
    tokenTTL: 24h

# Everything not owned by console is federated to a backend. Requests under
# prefix are reverse-proxied to url, the prefix replaced by url's path:
# /api/deploy/catalog -> http://swissd.swiss.svc:8080/api/catalog. The backend
# receives X-Remote-User / X-Remote-Group and the caller's Bearer token.
# Access is RBAC on resource "backends", resourceName = name.
backends:
  - name: swiss
    prefix: /api/deploy
    url: http://swissd.swiss.svc:8080/api

  # The inference gateway the Playground talks to. Nothing here names a URL: the
  # profile is swiss's site profile ConfigMap, the document swissd deploys from,
  # and console reads the entrypoint Service, the route and the key Secret out of
  # it -- then keeps reading, so a model deployed later shows up without a restart.
  # Without swissd, name the route ConfigMap and its Service directly:
  #
  #   gateway:
  #     configMap: llm/openresty-conf
  #     service: llm/openresty
  #     route: llm-gateway        # optional; the aggregate route is chosen
  #     secretRef: llm/openresty-keys
  - name: llm
    prefix: /api/llm
    gateway:
      profile: llm/site-profile

# The router: programs call models at <console>/v1 with API keys admins issue on
# the router's API keys page. console keeps their hashes in this Secret (creating
# it) and forwards /v1 to the backend named here with that backend's own
# credential. Usage is exported as router_* metrics on server.metricsAddr.
router:
  # Choose one authority. Existing installations use secret until their keys
  # have been imported with explicit owners. CRD mode authenticates locally
  # using APIKey/User Informers.
  keySource: secret
  namespace: console
  secret: console/console-api-keys
  backend: llm
  # Enable only during an explicit legacy-owner import, before the CRD cutover.
  migration: false
  pipeline:
    maxAttempts: 1
    retryBackoff: 0s
    maxSSEFrameBytes: 1048576
    # Zero disables each optional generation/circuit limit.
    maxDuration: 0s
    maxResponseBytes: 0
    repeatDeltaLimit: 0
    circuitFailureThreshold: 0
    circuitResetAfter: 30s

# Enable after CRD cutover, prices and durable dependencies are configured.
# Production credentials are injected through the named environment variables.
billing:
  enabled: false
  role: gateway
  currency: USD
  admissionThreshold: 0
  store:
    driver: postgres
    dsnEnv: CONSOLE_BILLING_DSN
    maxConnections: 20
    # sqlitePath is only for single-process adapter/development use.
    sqlitePath: ""
  queue:
    urlEnv: CONSOLE_BILLING_REDIS_URL
    prefix: modelsphere:billing
    partitions: 8
    leaseDuration: 30s
  journal:
    directory: /var/lib/console/billing
    shardIDEnv: CONSOLE_JOURNAL_SHARD
    segmentBytes: 16777216
    maxBytes: 1073741824
    minFreeBytes: 0
    retention: 24h
    syncMode: record
    syncInterval: 100ms
    failurePolicy: continue
    replayInterval: 1s
    replayRate: 1000
    # Explicit recovery role only; republish retained original IDs after queue data loss.
    replayRetained: false
  usage:
    flushInterval: 5s
    pollInterval: 100ms
    maxEvents: 500
    maxBytes: 4194304
    concurrency: 4
  settlement:
    interval: 10s
    maxWallets: 100
    maxCharges: 1000
    leaseName: console-billing-settlement
    leaseDuration: 30s
    renewDeadline: 20s
    retryPeriod: 5s
  reconciliation:
    # A trusted read-only GET endpoint; never an inference/generation endpoint.
    url: ""
    upstream: ""
    tokenEnv: ""

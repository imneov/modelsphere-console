# Existing gateway and credential Secret in the release namespace.
playground:
  gateway:
    profile: models/site-profile

router:
  keySource: crd
  migration: false
  pipeline:
    maxAttempts: 2
    maxDuration: 120s
    maxResponseBytes: 16777216
    repeatDeltaLimit: 32
    circuitFailureThreshold: 5
    circuitResetAfter: 30s
    # Upstream answers replayed on another route serving the same model.
    failoverStatuses: [429, 500, 502, 503, 504]

billing:
  enabled: true
  credentials:
    secretName: console-billing-credentials
    dsnKey: postgres-dsn
    redisKey: redis-url
  settings:
    currency: USD
    admissionThreshold: 0
  persistence:
    size: 10Gi
  workers:
    usage:
      replicas: 2
    settlement:
      replicas: 2
cluster:
  # Control-plane projection capacity; validate against the API server's budget.
  clientQPS: 50
  clientBurst: 100

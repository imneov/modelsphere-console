apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
data:
  console.yaml: |
    server:
      addr: ":8080"
      auth:
        issuer: {{ .Values.auth.issuer | quote }}
        tokenTTL: {{ .Values.auth.tokenTTL | quote }}
        # jwtSecret is injected from the Secret via env, not rendered here.
    backends:
      {{- range .Values.backends }}
      - name: {{ .name | quote }}
        prefix: {{ .prefix | quote }}
        url: {{ .url | quote }}
        {{- with .apiKeyEnv }}
        apiKeyEnv: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- $gw := .Values.playground.gateway }}
      {{- if or $gw.profile $gw.configMap }}
      # Resolved from the cluster at startup: see the gateway section of values.
      - name: llm
        prefix: /api/llm
        {{- with $gw.apiKeyEnv }}
        apiKeyEnv: {{ . | quote }}
        {{- end }}
        gateway:
          {{- with $gw.profile }}
          profile: {{ . | quote }}
          {{- end }}
          {{- with $gw.configMap }}
          configMap: {{ . | quote }}
          {{- end }}
          {{- with $gw.service }}
          service: {{ . | quote }}
          {{- end }}
          {{- with $gw.route }}
          route: {{ . | quote }}
          {{- end }}
          {{- with $gw.secretRef }}
          secretRef: {{ . | quote }}
          {{- end }}
      {{- end }}
    {{- if include "console.apiKeys.enabled" . }}
    apiKeys:
      secret: {{ printf "%s/%s" .Release.Namespace (include "console.apiKeys.secret" .) | quote }}
      backend: llm
      {{- with .Values.apiKeys.maxBodyBytes }}
      maxBodyBytes: {{ . | int64 }}
      {{- end }}
    {{- end }}

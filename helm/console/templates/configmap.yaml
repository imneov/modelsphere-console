{{- if .Values.billing.enabled }}
{{- if or (ne .Values.router.keySource "crd") (not (include "console.router.enabled" .)) }}{{ fail "billing requires the router, an inference gateway, and router.keySource=crd" }}{{ end }}
{{- if ne .Values.billing.settings.store.driver "postgres" }}{{ fail "distributed billing chart requires PostgreSQL" }}{{ end }}
{{- $_ := required "billing.credentials.secretName is required" .Values.billing.credentials.secretName }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
data:
  console.yaml: |
    cluster:
      clientQPS: {{ .Values.cluster.clientQPS }}
      clientBurst: {{ .Values.cluster.clientBurst }}
    server:
      addr: ":8080"
      metricsAddr: {{ printf ":%d" (int .Values.metrics.port) | quote }}
      auth:
        {{- if .Values.auth.disabled }}
        disabled: true
        {{- end }}
        issuer: {{ .Values.auth.issuer | quote }}
        tokenTTL: {{ .Values.auth.tokenTTL | quote }}
        # jwtSecret is injected from the Secret via env, not rendered here.
    backends:
      {{- range .Values.backends }}
      - name: {{ .name | quote }}
        prefix: {{ .prefix | quote }}
        url: {{ .url | quote }}
        {{- with .apiKeyEnv }}
        apiKeyEnv: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- $swissd := include "console.swiss.backend" . }}
      {{- if $swissd }}
      {{- $swissd = $swissd | fromJson }}
      {{- range .Values.backends }}
      {{- if eq .name "swiss" }}{{ fail "backends names \"swiss\" and swiss.enabled or externalSwiss.url adds one; drop the backends entry" }}{{ end }}
      {{- end }}
      # swissd: see the swiss and externalSwiss sections of values.
      - name: swiss
        prefix: /api/deploy
        url: {{ $swissd.url | quote }}
        {{- if $swissd.secretName }}
        apiKeyEnv: SWISS_PROXY_KEY
        {{- end }}
      {{- end }}
      {{- $gw := .Values.playground.gateway }}
      {{- if and (not .Values.higress.enabled) (include "console.gateway" .) }}
      # Resolved from the cluster at startup: see the gateway section of values.
      - name: llm
        prefix: /api/llm
        {{- with $gw.apiKeyEnv }}
        apiKeyEnv: {{ . | quote }}
        {{- end }}
        gateway:
          {{- with include "console.gateway.profile" . }}
          profile: {{ . | quote }}
          {{- end }}
          {{- with $gw.configMap }}
          configMap: {{ . | quote }}
          {{- end }}
          {{- with $gw.service }}
          service: {{ . | quote }}
          {{- end }}
          {{- with $gw.route }}
          route: {{ . | quote }}
          {{- end }}
          {{- with $gw.secretRef }}
          secretRef: {{ . | quote }}
          {{- end }}
      {{- end }}
    {{- if include "console.router.enabled" . }}
    router:
      keySource: {{ .Values.router.keySource | quote }}
      migration: {{ .Values.router.migration }}
      namespace: {{ .Release.Namespace | quote }}
      secret: {{ printf "%s/%s" .Release.Namespace (include "console.router.secret" .) | quote }}
      backend: llm
      {{- with .Values.router.pipeline }}
      pipeline: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.router.maxBodyBytes }}
      maxBodyBytes: {{ . | int64 }}
      {{- end }}
    {{- end }}

    {{- if .Values.higress.enabled }}
    higress:
      enabled: true
      models: {{ .Values.higress.models | toJson }}
      route: {{ .Values.higress.route | quote }}
      sessionOrigin: {{ .Values.higress.sessionOrigin | quote }}
    {{- end }}

    {{- if .Values.billing.enabled }}
    billing:
      enabled: true
      role: gateway
      {{- toYaml .Values.billing.settings | nindent 6 }}
    {{- end }}

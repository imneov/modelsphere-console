{{- /*
The signing secret. Generated once when auth.jwtSecret is empty, and preserved
across upgrades by reading back the existing Secret — regenerating it would
invalidate every issued token. Set auth.jwtSecret explicitly to share it with
Rise Global.
*/ -}}
{{- $name := include "console.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $secret := .Values.auth.jwtSecret -}}
{{- if not $secret -}}
{{-   if and $existing $existing.data (index $existing.data "jwtSecret") -}}
{{-     $secret = index $existing.data "jwtSecret" | b64dec -}}
{{-   else -}}
{{-     $secret = randAlphaNum 48 -}}
{{-   end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtSecret: {{ $secret | quote }}

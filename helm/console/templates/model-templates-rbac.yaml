{{- if and .Values.rbac.create (include "console.modelTemplates.enabled" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "console.fullname" . }}-model-templates
  namespace: {{ include "console.modelTemplates.namespace" . | quote }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "console.modelTemplates.configMap" . | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "console.fullname" . }}-model-templates
  namespace: {{ include "console.modelTemplates.namespace" . | quote }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "console.fullname" . }}-model-templates
subjects:
  - kind: ServiceAccount
    name: {{ include "console.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

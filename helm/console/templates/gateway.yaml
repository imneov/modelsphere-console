{{- /*
The built-in inference gateway: llm-openresty with one aggregate route that
serves the demo model and gateway.models. Installed unless playground.gateway
names an existing gateway, so a bare `helm install` has a working Playground
and /v1. See docs/console-design.md, "One-command install".
*/ -}}
{{- if include "console.gateway.builtin" . }}
{{- $name := include "console.gateway.name" . }}
{{- if not (regexMatch "^[a-z0-9._-]+$" .Values.gateway.route) }}{{ fail "gateway.route may only use a-z 0-9 . _ -" }}{{ end }}
{{- /* The key console sends. Generated once and kept: a new key on every upgrade
       would break nothing (console re-reads it) but would churn the Secret. */}}
{{- $keySecret := printf "%s-keys" $name }}
{{- $key := randAlphaNum 40 }}
{{- with lookup "v1" "Secret" .Release.Namespace $keySecret }}
{{-   with index (.data | default dict) "keys" }}
{{-     $key = (b64dec . | splitList ":" | first) }}
{{-   end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $keySecret }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
type: Opaque
stringData:
  keys: "{{ $key }}:console"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-routes
  labels:
    {{- include "console.labels" . | nindent 4 }}
data:
  session_route_{{ .Values.gateway.route }}.conf: |
    {{- include "console.gateway.routeConf" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "console.componentSelectorLabels" (list . "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "console.componentSelectorLabels" (list . "gateway") | nindent 8 }}
      annotations:
        # Routes and keys are reloaded in place by the sidecar; this only rolls
        # the pods when the rendered route changes shape at upgrade.
        checksum/routes: {{ include "console.gateway.routeConf" . | sha256sum }}
    spec:
      # Lets the reload sidecar signal the nginx master.
      shareProcessNamespace: true
      # Long generations drain rather than being cut; nginx stops on SIGQUIT.
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      containers:
        - name: openresty
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 5"] }
          ports:
            - { name: dispatch, containerPort: 8080 }
            - { name: health, containerPort: 8090 }
          volumeMounts:
            - { name: routes, mountPath: /usr/local/openresty/nginx/conf/conf.d/routes }
            - { name: sock, mountPath: /usr/local/openresty/nginx/sock }
            # A whole-volume mount: a subPath copy would never see a rotated key.
            - { name: keys, mountPath: /etc/openresty/api-keys, readOnly: true }
          startupProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
        - name: reload
          image: {{ .Values.gateway.reloadImage | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          # The route mount must be the first --watch: orphaned sockets are
          # pruned against it.
          args: ["--watch", "/watch", "--watch", "/keys", "--process", "nginx: master", "--sock-dir", "/usr/local/openresty/nginx/sock"]
          volumeMounts:
            - { name: routes, mountPath: /watch }
            - { name: sock, mountPath: /usr/local/openresty/nginx/sock }
            - { name: keys, mountPath: /keys, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: routes
          configMap: { name: {{ $name }}-routes }
        - name: sock
          emptyDir: {}
        - name: keys
          secret: { secretName: {{ $keySecret }} }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    {{- include "console.componentSelectorLabels" (list . "gateway") | nindent 4 }}
  ports:
    - { name: dispatch, port: 8080, targetPort: dispatch }
{{- end }}

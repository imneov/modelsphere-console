{{- if include "console.modelTemplates.enabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "console.modelTemplates.service" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog
spec:
  type: ClusterIP
  selector:
    {{- include "console.selectorLabels" . | nindent 4 }}
  ports:
    - name: catalog
      port: {{ .Values.modelTemplates.port }}
      targetPort: catalog
      protocol: TCP
{{- end }}

apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" .Values.billing.enabled }}
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  {{- if .Values.billing.enabled }}
  serviceName: {{ include "console.fullname" . }}-journal
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "console.selectorLabels" . | nindent 8 }}
        console.modelsphere.io/key-source: {{ .Values.router.keySource | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "console.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Past console's drain delay plus the time it gives in-flight generations.
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 75
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "console.selectorLabels" . | nindent 14 }}
      containers:
        - name: console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/console/console.yaml"]
          env:
            - name: CONSOLE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "console.fullname" . }}
                  key: jwtSecret
            {{- $swissd := include "console.swiss.backend" . }}
            {{- if $swissd }}
            {{- $swissd = $swissd | fromJson }}
            {{- if $swissd.secretName }}
            # swissd's front-proxy key: see the swiss and externalSwiss sections of values.
            - name: SWISS_PROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $swissd.secretName | quote }}
                  key: {{ $swissd.secretKey | quote }}
            {{- end }}
            {{- end }}
            {{- /* Backend credentials, keyed by the env var a backend's apiKeyEnv
                   names. An existing Secret, not one this chart writes. */}}
            {{- range $env, $ref := .Values.backendSecrets }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName | quote }}
                  key: {{ $ref.key | quote }}
            {{- end }}
            {{- if .Values.billing.enabled }}
            {{- include "console.billing.env" . | nindent 12 }}
            - name: {{ .Values.billing.settings.journal.shardIDEnv }}
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/console
              readOnly: true
            {{- if .Values.billing.enabled }}
            - name: journal
              mountPath: {{ .Values.billing.settings.journal.directory | quote }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "console.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}

  {{- if .Values.billing.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: journal
      spec:
        accessModes: {{- toYaml .Values.billing.persistence.accessModes | nindent 10 }}
        {{- with .Values.billing.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.billing.persistence.size | quote }}
  {{- end }}

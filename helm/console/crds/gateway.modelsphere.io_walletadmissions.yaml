apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: walletadmissions.gateway.modelsphere.io
spec:
  group: gateway.modelsphere.io
  scope: Namespaced
  names:
    plural: walletadmissions
    singular: walletadmission
    kind: WalletAdmission
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - principalKind
            - principalUID
            properties:
              principalKind:
                type: string
                enum:
                - User
              principalUID:
                type: string
                minLength: 1
                maxLength: 512
            x-kubernetes-validations:
            - rule: self == oldSelf
              message: wallet identity is immutable
          status:
            type: object
            properties:
              billingState:
                type: string
                enum:
                - allowed
                - blocked
              walletRevision:
                type: integer
                format: int64
                minimum: 0
                x-kubernetes-validations:
                - rule: self >= oldSelf
                  message: wallet revision cannot decrease

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apikeys.gateway.modelsphere.io
spec:
  group: gateway.modelsphere.io
  scope: Namespaced
  names:
    plural: apikeys
    singular: apikey
    kind: APIKey
    shortNames:
    - mskey
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - id
            - name
            - user
            - principalKind
            - principalUID
            - walletID
            - hash
            - createdAt
            - from
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 512
              name:
                type: string
                minLength: 1
                maxLength: 512
              user:
                type: string
                minLength: 1
                maxLength: 512
              principalKind:
                type: string
                enum:
                - User
                maxLength: 512
              principalUID:
                type: string
                minLength: 1
                maxLength: 512
              walletID:
                type: string
                minLength: 1
                maxLength: 512
              creator:
                type: string
                maxLength: 512
              createdBy:
                type: string
                maxLength: 512
              description:
                type: string
                maxLength: 65536
              hash:
                type: string
                minLength: 1
                pattern: ^[a-f0-9]{64}$
                maxLength: 512
              salt:
                type: string
                maxLength: 512
              keyMasked:
                type: string
                maxLength: 512
              from:
                type: string
                enum:
                - system
                - external
                maxLength: 512
              createdAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
              models:
                type: array
                items:
                  type: string
                x-kubernetes-list-type: set
              disabled:
                type: boolean
            x-kubernetes-validations:
            - rule: has(self.id) == has(oldSelf.id) && (!has(self.id) || self.id ==
                oldSelf.id)
              message: id is immutable
            - rule: has(self.user) == has(oldSelf.user) && (!has(self.user) || self.user
                == oldSelf.user)
              message: user is immutable
            - rule: has(self.principalKind) == has(oldSelf.principalKind) && (!has(self.principalKind)
                || self.principalKind == oldSelf.principalKind)
              message: principalKind is immutable
            - rule: has(self.principalUID) == has(oldSelf.principalUID) && (!has(self.principalUID)
                || self.principalUID == oldSelf.principalUID)
              message: principalUID is immutable
            - rule: has(self.walletID) == has(oldSelf.walletID) && (!has(self.walletID)
                || self.walletID == oldSelf.walletID)
              message: walletID is immutable
            - rule: has(self.hash) == has(oldSelf.hash) && (!has(self.hash) || self.hash
                == oldSelf.hash)
              message: hash is immutable
            - rule: has(self.salt) == has(oldSelf.salt) && (!has(self.salt) || self.salt
                == oldSelf.salt)
              message: salt is immutable
            - rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name
                == oldSelf.name)
              message: name is immutable
            - rule: has(self.createdAt) == has(oldSelf.createdAt) && (!has(self.createdAt)
                || self.createdAt == oldSelf.createdAt)
              message: createdAt is immutable
            - rule: has(self.creator) == has(oldSelf.creator) && (!has(self.creator)
                || self.creator == oldSelf.creator)
              message: creator is immutable
            - rule: has(self.createdBy) == has(oldSelf.createdBy) && (!has(self.createdBy)
                || self.createdBy == oldSelf.createdBy)
              message: createdBy is immutable
            - rule: has(self.keyMasked) == has(oldSelf.keyMasked) && (!has(self.keyMasked)
                || self.keyMasked == oldSelf.keyMasked)
              message: keyMasked is immutable
            - rule: has(self.from) == has(oldSelf.from) && (!has(self.from) || self.from
                == oldSelf.from)
              message: from is immutable
            - rule: self.walletID == self.principalUID
              message: wallet must belong to the key principal
            - rule: self.from != 'system' || (has(self.creator) && self.creator !=
                '')
              message: issued keys require a creator
          status:
            type: object
            properties:
              state:
                type: string
                enum:
                - enabled
                - disabled
                - system-disabled
              disabledReason:
                type: string
              billingState:
                type: string
                enum:
                - allowed
                - blocked
              walletRevision:
                type: integer
                format: int64
                minimum: 0
    additionalPrinterColumns:
    - name: User
      type: string
      jsonPath: .spec.user
    - name: State
      type: string
      jsonPath: .status.state
    - name: Billing
      type: string
      jsonPath: .status.billingState

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pricerules.gateway.modelsphere.io
spec:
  group: gateway.modelsphere.io
  scope: Namespaced
  names:
    plural: pricerules
    singular: pricerule
    kind: PriceRule
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - ruleID
            - priceVersion
            - model
            - currency
            - unitTokens
            - inputRate
            - cacheRate
            - outputRate
            properties:
              ruleID:
                type: string
                minLength: 1
                maxLength: 512
              priceVersion:
                type: string
                minLength: 1
                maxLength: 512
              model:
                type: string
                minLength: 1
                maxLength: 512
              currency:
                type: string
                pattern: ^[A-Z]{3}$
                maxLength: 3
              unitTokens:
                type: integer
                format: int64
                minimum: 1
              inputRate:
                type: integer
                format: int64
                minimum: 0
              cacheRate:
                type: integer
                format: int64
                minimum: 0
              outputRate:
                type: integer
                format: int64
                minimum: 0
            x-kubernetes-validations:
            - rule: self.model == oldSelf.model
              message: model is immutable
            - rule: self.ruleID == oldSelf.ruleID
              message: ruleID is immutable
          status:
            type: object
            properties:
              observedVersion:
                type: string
              observedAt:
                type: string
                format: date-time
              error:
                type: string

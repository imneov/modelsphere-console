---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: loginrecords.iam.theriseunion.io
spec:
  group: iam.theriseunion.io
  names:
    categories:
    - iam
    kind: LoginRecord
    listKind: LoginRecordList
    plural: loginrecords
    singular: loginrecord
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.labels['iam\.theriseunion\.io/username']
      name: User
      type: string
    - jsonPath: .spec.success
      name: Success
      type: boolean
    - jsonPath: .spec.sourceIP
      name: Source-IP
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LoginRecord records one authentication attempt.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              provider:
                type: string
              reason:
                type: string
              sourceIP:
                type: string
              success:
                type: boolean
              type:
                type: string
              userAgent:
                type: string
            required:
            - success
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true

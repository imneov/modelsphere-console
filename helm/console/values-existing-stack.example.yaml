# Values for a cluster that already runs Swiss and its gateway. Copy to
# console-values.yaml and replace each value; helm/console/README.md shows how
# to find them.

externalSwiss:
  # http://<swiss-service>.<namespace>.svc:<port>/api
  url: "http://swiss.swiss-system.svc:80/api"
  # A copy, in this release's namespace, of swissd's auth.proxyKey: see
  # externalSwiss in values.yaml for the two commands.
  proxyKey:
    secretName: "swiss-proxy-key"
  # Swiss's site profile ConfigMap, <swiss-release>-profile in its namespace.
  # The Playground resolves the gateway from it.
  profile: "swiss-system/swiss-profile"

playground:
  gateway:
    # The profile's route.nginxService and route.auth.secretRef, as
    # namespace/name; a bare secretRef name lives in Swiss's namespace. The chart
    # grants read-only access in each namespace named here; the profile's
    # route.nginxConfigMap must live in one of them, or needs a Role of its own.
    # Drop secretRef when the profile names no Secret.
    service: "llm-route/openresty"
    secretRef: "llm-route/openresty-api-keys"
